name: Code checks

on:
  push:
    branches: [main, duong]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE_BTL_Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FE_BTL_Mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform all
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5257
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE_BTL_Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BE_BTL_Mobile/package-lock.json
      - run: npm ci
      - run: npm test
